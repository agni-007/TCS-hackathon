{% extends 'base.html' %}

{% block title %}Ask the Data - AI Campus Analyst{% endblock %}

{% block content %}
<h2 class="mb-4">💬 Ask the Data</h2>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <div id="chat-window" class="mb-4" style="height: 400px; overflow-y: auto; border: 1px solid #dee2e6; padding: 1rem; border-radius: 0.375rem; background: #fff;">
                    <div class="text-center text-muted mb-3">Ask any question about your dataset to get an AI-powered answer.</div>
                </div>
                <form id="ask-form" class="input-group">
                    <input type="text" id="question" class="form-control" placeholder="e.g. Which department has the highest placement rate?" required>
                    <button type="submit" class="btn btn-primary">Ask</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('ask-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const questionInput = document.getElementById('question');
        const chatWindow = document.getElementById('chat-window');
        const question = questionInput.value;

        if (!question) return;

        // Append user message
        chatWindow.innerHTML += `<div class="text-end mb-3"><span class="bg-primary text-white p-2 rounded d-inline-block">${question}</span></div>`;
        questionInput.value = '';

        // Show loading
        const loadingId = 'loading-' + Date.now();
        chatWindow.innerHTML += `<div class="text-start mb-3" id="${loadingId}"><span class="bg-light text-dark p-2 rounded d-inline-block">Analyzing...</span></div>`;
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const response = await fetch("{% url 'ask' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: new URLSearchParams({ 'question': question })
            });
            const data = await response.json();

            document.getElementById(loadingId).remove();
            const answer = data.answer || data.error || 'No response received.';
            chatWindow.innerHTML += `<div class="text-start mb-3"><span class="bg-light text-dark p-2 rounded d-inline-block">${answer}</span></div>`;
        } catch (err) {
            document.getElementById(loadingId).remove();
            chatWindow.innerHTML += `<div class="text-start mb-3 text-danger">Error connecting to server.</div>`;
        }
        chatWindow.scrollTop = chatWindow.scrollHeight;
    });
</script>
{% endblock %}
