{% extends 'base.html' %}

{% block title %}Upload Data - AI Campus Analyst{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0">Upload Campus Dataset</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Upload a CSV or Excel file to begin your analysis.</p>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="file" class="form-label">Select File (.csv, .xlsx, .xls)</label>
                        <input type="file" name="file" class="form-control" id="file" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Analyze Dataset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
